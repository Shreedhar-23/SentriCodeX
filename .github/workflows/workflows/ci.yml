name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python Engine & Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -r engine/requirements-dev.txt

      - name: Run pytest
        run: pytest -v

      - name: Run mypy
        run: python -m mypy rules engine/sentricodex --ignore-missing-imports
        env:
          PYTHONPATH: engine

  extension:
    name: TypeScript Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Compile
        working-directory: extension
        run: npm run compile

      - name: Lint
        working-directory: extension
        run: npm run lint

      - name: Unit tests
        working-directory: extension
        run: npm run test:unit

      # Integration tests (real VS Code instance) are intentionally not
      # run here: they need a display server (e.g. xvfb) and are slower
      # / flakier in CI than the signal they add justifies for this
      # project's size. They remain part of the required local release
      # checklist - see docs/TESTING.md.

  package:
    name: VSIX Packaging Sanity Check
    runs-on: ubuntu-latest
    needs: [python, extension]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        working-directory: extension
        run: npm ci

      - name: Build VSIX
        working-directory: extension
        run: npx vsce package --allow-missing-repository
